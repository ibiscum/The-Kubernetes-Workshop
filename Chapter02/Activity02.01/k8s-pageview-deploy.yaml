apiVersion: apps/v1
kind: Deployment
metadata:
  name: k8s-pageview
  namespace: the-kubernetes-workshop
spec:
  replicas: 1
  selector:
    matchLabels:
      tier: frontend
  template:
    metadata:
      labels:
        tier: frontend
    spec:
      containers:
      - name: k8s-pageview
        image: packtworkshops/the-kubernetes-workshop:pageview
        resources:
          requests:
            memory: "64Mi"
            cpu: "250m"
          limits:
            memory: "128Mi"
            cpu: "500m"
        securityContext:
            runAsUser: 1000
            runAsGroup: 1000
            readOnlyRootFilesystem: true
